# Cada dia pone en la web las 6 ultimas publicaciones del Instagram de Touring (sin cuenta de Instagram).
# Si hay fotos nuevas, hace commit; GitHub Pages (y Hostinger, si esta conectado al repo) publican el cambio solos.
name: Instagram de Touring

on:
  schedule:
    - cron: "15 8 * * *"   # 08:15 UTC = 09:15 / 10:15 en Barcelona
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow
        run: pip install pillow
      - name: Ultimas publicaciones
        run: python .github/instagram/actualizar.py --raiz .
      - name: Commit si hay cambios
        run: |
          git add assets/instagram
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram: ultimas publicaciones"
          git push
